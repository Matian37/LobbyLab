name: LobbyLab

services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      timeout: 2s
      start_period: 10s
    volumes:
      - ./data/db:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db-net

  nats:
    image: nats:2.14-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - ./data/nats:/data
    networks:
      - nats-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
      LOG_LEVEL: info
      PUBLIC_GAME_LAUNCH_URL: ${PUBLIC_GAME_LAUNCH_URL}
      GAME_CLIENT_FILE: ${GAME_CLIENT_FILE}
      DOWNLOADS_DIR: /api/downloads
    volumes:
      - ${DOWNLOADS_DIR}:/api/downloads
    ports:
      - "3000:3000"
    networks:
      - db-net
    depends_on:
      db:
        condition: service_healthy

  server-manager:
    build:
      context: ./server-manager
      dockerfile: Dockerfile
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NATS_URI: ${NATS_URI}
      NATS_NETWORK_NAME: "LobbyLab_nats-net"
      PUBLIC_HOST: ${PUBLIC_HOST}
      GAME_SERVER_IMAGE: "game-server:latest"
      GAME_SERVER_COUNT: ${GAME_SERVER_COUNT}
      GAME_SERVER_EXPOSE_PORTS: ${GAME_SERVER_EXPOSE_PORTS}
      GAME_SERVER_CLIENT_PORT: ${GAME_SERVER_CLIENT_PORT}
      GAME_SERVER_LOG_LEVEL: info
      PLAYERS_PER_ROOM: ${PLAYERS_PER_ROOM}
      LOG_LEVEL: info
    volumes:
      # TODO: required but dangerous, docker socket proxy would be safer instead
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - db-net
      - nats-net
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

networks:
  db-net:
    driver: bridge
    internal: true
  nats-net:
    driver: bridge
    internal: true
