name: End-to-End CI

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./e2e

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ./e2e/.python-version
          cache: pip

      - name: Install Python Dependencies
        run: pip install .

      - name: Run Tests
        run: pytest -vv --timeout=120 .
