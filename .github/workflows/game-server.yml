name: game-server CI

on:
  push:
    branches: ["main"]
    paths:
      - "game-server/**"
  pull_request:
    branches: ["main"]
    paths:
      - "game-server/**"

defaults:
  run:
    working-directory: game-server/host/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: game-server/host/go.mod
          cache: true
          cache-dependency-path: game-server/host/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: game-server/host

      - name: Run Tests
        run: go test -v --timeout 1m ./...
