name: server-manager CI

on:
  push:
    branches: ["main"]
    paths:
      - "server-manager/**"
  pull_request:
    branches: ["main"]
    paths:
      - "server-manager/**"

defaults:
  run:
    working-directory: server-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server-manager/go.mod
          cache: true
          cache-dependency-path: server-manager/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server-manager

      - name: Add Public Network
        run: docker network create multiplayer-asset_public-net || true

      - name: Run Unit Tests
        run: go test -v --timeout 1m ./...

      - name: Run Race Tests
        run: go test -v -race -run="^TestRace" --timeout 1m ./...

      - name: Pull Image for Integration Tests
        run: docker pull busybox:latest

      - name: Run Integration Tests
        run: go test -v -tags=integration -run="^TestIntegration" --timeout 1m ./...