name: server-manager e2e

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "server-manager/**"

defaults:
  run:
    working-directory: ./server-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: "server-manager/go.sum"

      - name: Pull DB Image
        run: docker pull postgres:18.4-alpine

      - name: Run E2E Tests
        run: go test -v -tags=e2e -run="^TestE2E" --timeout 3m ./...
