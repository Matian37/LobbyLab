name: server-manager e2e

on:
  pull_request:
    branches: ["main"]
    paths:
      - "server-manager/**"

defaults:
  run:
    working-directory: server-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server-manager/go.mod
          cache: true
          cache-dependency-path: server-manager/go.sum

      - name: Pull DB Image
        run: docker pull postgres:18.6-alpine

      - name: Pull Worker Test Container Image
        run: docker pull busybox:latest

      - name: Run E2E Tests
        run: go test -v -tags=e2e -run="^TestE2E" --timeout 3m ./...
